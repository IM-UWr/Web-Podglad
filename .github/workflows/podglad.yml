name: Podgląd nowego wyglądu

# Strona IM UWr: kod z main repozytorium IM-UWr/Web-Core, treści z main repozytoriów IM-UWr/Web-* (to, co w CMS),
# publikowana na GitHub Pages tego repozytorium. Budowanie w Web-Core (deploy.yml) jest wyłączone od 7.11.2026.
# - Ręcznie: Actions → „Podgląd nowego wyglądu” → Run workflow (można podać inną gałąź Web-Core).
# - Po zmianie treści albo planu zajęć: sygnał repository_dispatch z Web-Core (podglad-przekaznik.yml przekazuje
#   „tresc-zmieniona” z repozytoriów treści i „przebuduj” z plan-zajec.yml).
# - Automatycznie: co godzinę (w praktyce GitHub uruchamia co kilka godzin) i po zmianie tego pliku.
# Zbudowana strona trafia też na gałąź „zbudowana” tego repozytorium (bez PDF-ów i dużych plików) — do zrzutów ekranu.
# Przy ręcznym podaniu innej gałęzi kodu do treści z main dołączana jest gałąź o tej samej nazwie, jeśli repozytorium ją ma.
on:
  workflow_dispatch:
    inputs:
      galaz:
        description: 'Gałąź IM-UWr/Web-Core'
        required: false
        default: 'main'
  repository_dispatch:
    types: [tresc-zmieniona, przebuduj]
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GALAZ: ${{ inputs.galaz || 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kod strony (IM-UWr/Web-Core)
        uses: actions/checkout@v5
        with:
          repository: IM-UWr/Web-Core
          ref: ${{ env.GALAZ }}

      - name: Treści z repozytoriów IM-UWr/Web-*
        env:
          ZDARZENIE: ${{ github.event_name }} ${{ github.event.action }} ${{ github.event.client_payload.repo }}
        run: |
          echo "::notice title=Gałąź::${GALAZ} @ $(git rev-parse --short HEAD) — $(git log -1 --format=%s) (${ZDARZENIE})"
          TRESCI="$RUNNER_TEMP/tresci"
          for r in $(python3 -c "import json; print(*json.load(open('tresci.json'))['repozytoria'])"); do
            git clone -q --filter=blob:none --branch main "https://github.com/IM-UWr/$r.git" "$TRESCI/$r"
            if [ "$GALAZ" != main ] && git -C "$TRESCI/$r" fetch -q origin "refs/heads/$GALAZ:refs/remotes/origin/podglad" 2>/dev/null; then
              if git -C "$TRESCI/$r" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  merge -q --no-edit origin/podglad; then
                echo "$r: main + $GALAZ"
              else
                git -C "$TRESCI/$r" merge --abort
                git -C "$TRESCI/$r" checkout -q origin/podglad
                echo "::warning title=Treści::$r: konflikt z main, użyta sama gałąź $GALAZ"
              fi
            else
              echo "$r: main"
            fi
          done
          python3 skrypty/pobierz_tresci.py --lokalnie "$TRESCI"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Konfiguracja GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Budowanie strony
        run: |
          export SITE_URL="${{ steps.pages.outputs.origin }}"
          export BASE_PATH="${{ steps.pages.outputs.base_path }}"
          npm run build
          echo "::notice title=Wynik::$(find dist -name '*.html' | wc -l) stron HTML, $(du -sh dist | cut -f1)"

      # Pliki stylów i skryptów mają w nazwach skróty treści, więc każda przebudowa je zmienia. Strona zapamiętana przez
      # przeglądarkę (albo wczytana z wyprzedzeniem) sprzed przebudowy szukałaby starych plików i wyświetliłaby się bez
      # wyglądu. Dlatego publikujemy też pliki z poprzedniej wersji (z gałęzi „zbudowana”, sprzed jej nadpisania).
      - name: Poprzednia wersja (pliki stylów i skryptów)
        run: git clone -q --depth 1 --branch zbudowana "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/poprzednia" || true

      - name: Kopia zbudowanej strony na gałęzi „zbudowana” (do zrzutów)
        env:
          TOKEN: ${{ github.token }}
        run: |
          rsync -a --exclude '*.pdf' --exclude '*.tex' --exclude '*.zip' --max-size=3m dist/ "$RUNNER_TEMP/zbudowana/"
          cd "$RUNNER_TEMP/zbudowana"
          git init -q
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Podgląd ${GALAZ} — $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/zbudowana

      - name: Pliki stylów i skryptów z poprzedniej wersji
        run: |
          if [ -d "$RUNNER_TEMP/poprzednia/_astro" ]; then cp -rn "$RUNNER_TEMP/poprzednia/_astro/." dist/_astro/; fi
          echo "::notice title=Pliki _astro::$(ls dist/_astro | wc -l) (bieżące i z poprzedniej wersji)"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
